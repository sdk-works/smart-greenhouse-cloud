%%--------------------------------------------------------------------
%% EMQX ACL — 智慧大棚平台（2026-10-17 收紧）
%%
%% 原则：默认拒绝；设备只能发布自己的上行、订阅自己的下行。
%% dashboard/运维账号仅限本机。
%%--------------------------------------------------------------------

%% 本机（云端服务进程）完全放行
{allow, {ipaddr, "127.0.0.1"}, all, ["$SYS/#", "#"]}.

%% dashboard 运维账号只读系统主题
{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.

%% ── 设备上下行：只覆盖本设备允许的主题 ──────────────────────
%% 环境监测终端与机器人：上行 telemetry
{allow, all, publish,   ["agri/device/+/up", "agri/robot/+/up"]}.
%% 下行：ACK / 指令 / 配置（设备只订阅自己的）
{allow, all, subscribe, ["agri/device/+/ack", "agri/device/+/command",
                         "agri/device/+/config", "agri/robot/+/command",
                         "agri/robot/+/config"]}.

%% 禁止跨设备订阅（明确拒绝通配）
{deny,  all, subscribe, ["agri/device/#", "agri/robot/#", "#"]}.

%% 系统主题一律拒绝
{deny,  all, subscribe, ["$SYS/#"]}.

%% 兜底：拒绝其余一切（不再 {allow, all}）
{deny,  all}.
