node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "/var/lib/emqx"
}
cluster {
  name = emqxcl
  discovery_strategy = manual
}
dashboard {
    listeners.http {
        bind = 18083
    }
}

# ── 授权：启用文件 ACL，默认拒绝（2026-10-17 收紧）──────────
# 规则见 /etc/emqx/acl.conf：
#   本机云端服务放行；设备仅能发布自己的上行、订阅自己的下行；其余全部拒绝。
authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = file
      enable = true
      path = "/etc/emqx/acl.conf"
    }
  ]
}
